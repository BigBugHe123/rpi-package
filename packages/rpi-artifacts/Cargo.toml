[package]
name = "rpi-artifacts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Publish workspace file references to the rpi web UI adapter"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "=0.3.20"
serde_json = "1"
cap-std = "=4.0.3"

[dev-dependencies]
tempfile = "3"
