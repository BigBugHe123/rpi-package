[package]
name = "rpi-providers"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified DeepSeek, OpenRouter, llama.cpp and proxy provider extension for rpi"
readme = "README.md"

# Publish native archives alongside the crates.io package.
[package.metadata.rpi]
prebuilt = true

[lib]
crate-type = ["cdylib", "rlib"]

# Use the SDK's maintained compat handling and stream idle watchdog.
# Keep these three dependencies on one SDK revision. This reviewed commit
# contains the unreleased transport fix; switch all three to its crates.io
# release before merging/publishing. Unrelated extensions retain their SDK.
[dependencies]
rpi-ai = { version = "=0.8.1", git = "https://github.com/bigfish1913/pi-rust", rev = "fb655c55a2b86dff04b55c5af164512f49307f01", features = ["providers"] }
rpi-plugin-sdk = { version = "=0.8.1", git = "https://github.com/bigfish1913/pi-rust", rev = "fb655c55a2b86dff04b55c5af164512f49307f01", features = ["provider"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "fs", "process"] }

[dev-dependencies]
rpi-extensions = { version = "=0.8.1", git = "https://github.com/bigfish1913/pi-rust", rev = "fb655c55a2b86dff04b55c5af164512f49307f01" }
tokio = { workspace = true, features = ["macros", "net", "io-util"] }
tempfile = "3"
