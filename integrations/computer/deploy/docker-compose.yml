services:
  rpi-computer:
    image: ghcr.nju.edu.cn/open-webui/computer@sha256:ab95a21d7d6c8ba43bcc7cf229dde9bb9147eb33a7403089da08a422ce8939c6
    container_name: rpi-computer
    restart: unless-stopped
    environment:
      CPTR_DATA_DIR: /data
      CPTR_LOG_LEVEL: INFO
      CPTR_CORS_ALLOWED_ORIGINS: https://rpi-computer.laofu.online,http://192.168.3.41:5232
      RPI_BIN: /opt/rpi/runtime/rpi
      RPI_CODING_AGENT_DIR: /opt/rpi/config
      RPI_EXTENSIONS_DIR: /opt/rpi/extensions
      RPI_ACP_SESSION_DIR: /data/rpi/acp-sessions
      RPI_ACP_LOG: /data/rpi/acp.log
      RPI_ACP_NO_AUTO_REGISTER_ZED: '1'
      RPI_PERMISSION_GATE: '0'
      RPI_OFFLINE: '1'
      TZ: Asia/Shanghai
    ports:
      - '5232:8000'
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - ./runtime:/opt/rpi/runtime:ro
      - ./config:/opt/rpi/config:ro
      - ./extensions:/opt/rpi/extensions:ro
    networks: [app-net]
    mem_limit: 1200m
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
networks:
  app-net:
    external: true
